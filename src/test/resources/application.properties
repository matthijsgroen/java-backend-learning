# Test-only JWT secret — 32 bytes (256-bit), safe for test use only.
# This overrides the ${DASHBOARDING_JWT_SECRET} env-var placeholder from main application.properties.
dashboarding.jwt.secret=dGVzdHNlY3JldGtleXRoYXRpczMyYnl0ZXNsb25nISE=
dashboarding.jwt.expiration-ms=86400000

# Database config for integration tests (requires running PostgreSQL on localhost:5435)
spring.datasource.url=jdbc:postgresql://localhost:5435/dashboarddb
spring.datasource.username=dashboarduser
spring.datasource.password=dashboardpass
spring.datasource.driver-class-name=org.postgresql.Driver
