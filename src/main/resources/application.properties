spring.application.name=dashboard-api

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5435/dashboarddb
spring.datasource.username=dashboarduser
spring.datasource.password=dashboardpass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false

# JSON / Jackson Configuration
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# Proxy Configuration
dashboarding.proxy.allowed-schemes=https
dashboarding.proxy.allowed-hosts=calendar.google.com

# JWT Configuration
# The secret must be supplied at runtime via the DASHBOARDING_JWT_SECRET environment variable.
# Generate with: openssl rand -base64 32
dashboarding.jwt.secret=${DASHBOARDING_JWT_SECRET}
dashboarding.jwt.expiration-ms=86400000