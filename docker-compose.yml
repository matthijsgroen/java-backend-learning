version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: dashboard-postgres
    environment:
      POSTGRES_DB: dashboarddb
      POSTGRES_USER: dashboarduser
      POSTGRES_PASSWORD: dashboardpass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboarduser -d dashboarddb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
