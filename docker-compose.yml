version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: learning-postgres
    environment:
      POSTGRES_DB: learningdb
      POSTGRES_USER: learninguser
      POSTGRES_PASSWORD: learningpass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learninguser -d learningdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
